name: Rendu
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
configFiles:
  Debug: Rendu.xcconfig
  Release: Rendu.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  Rendu:
    type: application
    platform: iOS
    sources:
      - path: Rendu
    # xcodegen writes this file from `properties` (and empties it without them).
    entitlements:
      path: Rendu/Rendu.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RENDU_BUNDLE_ID)
        INFOPLIST_FILE: Rendu/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rendu
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_OBJC_BRIDGING_HEADER: Rendu/Support/Rendu-Bridging-Header.h
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  RenduTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RenduTests
    dependencies:
      - target: Rendu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RENDU_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Rendu:
    build:
      targets:
        Rendu: all
    test:
      targets:
        - RenduTests
